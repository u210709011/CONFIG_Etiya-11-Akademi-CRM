spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: crm
    password: crm
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/crm

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

keycloak:
  client-id: order-service-m2m
  client-secret: order-service-m2m-secret

logging:
  level:
    com.etiya.crm.orderservice: DEBUG
