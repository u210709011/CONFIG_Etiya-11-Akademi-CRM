server:
  port: ${PORT:0}

spring:
  # B-15: bkz. customer-service/application.yml ayni ayarin aciklamasi.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
  # customer-service/contact-info-service/party-service/api-gateway ile ayni desen -
  # messages/messages.properties alt klasorde oldugu icin bu sekilde tutarli yaziliyor.
  messages:
    basename: messages/messages

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.etiya.crm.orderservice: INFO
