server:
  port: ${PORT:0}

spring:
  # Olmayan bir adrese istek gelince (404) kendi standart hata formatimiz donsun diye -
  # bu ikisi birlikte olmazsa Spring'in kendi varsayilan hata sayfasi donuyor.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
  # Hata mesaji metinleri bir alt klasorde tutuluyor; nerede aranacagi burada
  # belirtilmezse hata mesajlari bulunamiyor.
  messages:
    basename: messages/messages

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.etiya.crm.orderservice: INFO
