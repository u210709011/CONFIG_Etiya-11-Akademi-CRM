# contact-info-service - dev ortami.
# DB onceden ddl-auto:update ile olusturulmustu; baseline-on-migrate V1'i "zaten uygulanmis" sayar.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/contact_info_db
    username: crm
    password: crm
  jpa:
    show-sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/crm

keycloak:
  client-id: contact-info-service-m2m
  client-secret: contact-info-service-m2m-secret
