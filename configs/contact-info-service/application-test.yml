# contact-info-service - test ortami.

spring:
  jpa:
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/crm}

keycloak:
  client-id: ${KEYCLOAK_CLIENT_ID:contact-info-service-m2m}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:contact-info-service-m2m-secret}

eureka:
  instance:
    prefer-ip-address: true
