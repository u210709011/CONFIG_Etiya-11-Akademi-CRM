# lookup-service - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: application-dev.yml / application-test.yml / application-prod.yml
# NOT: Bu servis event uretmez/tuketmez -> kafka/redis konfigurasyonu YOK.

server:
  port: ${PORT:0}
  # Gateway arkasinda calisiyoruz; disaridan gorunen gercek adresi gateway'in ekledigi
  # header'lardan okur, kendi rastgele portunu degil.
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  # Hata mesaji metinleri bir alt klasorde tutuluyor; nerede aranacagi burada
  # belirtilmezse hata mesajlari bulunamiyor.
  messages:
    basename: messages/messages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # sema Flyway (V1/V2) ile gelir; Hibernate sadece dogrular
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 600000
      leak-detection-threshold: 30000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.etiya.crm.lookupservice: INFO
