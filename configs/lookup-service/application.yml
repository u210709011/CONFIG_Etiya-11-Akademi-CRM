# lookup-service - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: application-dev.yml / application-test.yml / application-prod.yml
# NOT: Bu servis event uretmez/tuketmez -> kafka/redis konfigurasyonu YOK.

server:
  port: ${PORT:0}
  # Gateway'in ekledigi X-Forwarded-* header'larina guven - bkz. customer-service/application.yml aciklamasi.
  forward-headers-strategy: framework

spring:
  # messages/messages.properties alt klasorde oldugu icin varsayilan basename ("messages",
  # root'u arar) bunu bulamiyordu - her resolve() cagrisi NoSuchMessageException firlatiyor,
  # yani her custom exception (EntityNotFoundException vb.) 404/409 yerine 500'e siziyordu.
  messages:
    basename: messages/messages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # sema Flyway (V1/V2) ile gelir; Hibernate sadece dogrular
  flyway:
    enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.etiya.crm.lookupservice: INFO
