# Party Service - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: application-dev.yml / application-test.yml / application-prod.yml

server:
  port: ${PORT:0}

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    # Spring Cloud OpenFeign'in circuit breaker entegrasyonu varsayilan olarak her cagriyi
    # ayri bir ExecutorService thread'inde calistirir (TimeLimiter). JwtTokenPropagationInterceptor
    # ise kullanicinin JWT'sini SecurityContextHolder (thread-local) uzerinden okuyor - farkli
    # thread'de bu context bos gelir ve interceptor sessizce gercek kullanici yerine M2M
    # service-account token'ini gonderir. disable-time-limiter=true cagriyi cagiran thread'de
    # senkron calistirir; timeout zaten asagidaki feign.client.config ile saglaniyor.
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  # messages/messages.properties alt klasorde oldugu icin varsayilan basename ("messages",
  # root'u arar) bunu bulamiyordu - her resolve() cagrisi NoSuchMessageException firlatiyor,
  # yani her custom exception (PartyNotFoundException vb.) 404/409 yerine 500'e siziyordu.
  messages:
    basename: messages/messages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/party_db}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
  kafka:
    consumer:
      group-id: party-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.etiya.crm.shared.events.customer
        spring.json.value.default.type: com.etiya.crm.shared.events.customer.CustomerDeletedEvent
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

logging:
  level:
    com.etiya.crm.partyservice: INFO

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 4000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
