# Party Service - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: application-dev.yml / application-test.yml / application-prod.yml

server:
  port: ${PORT:0}
  shutdown: graceful

spring:
  # Olmayan bir adrese istek gelince (404) kendi standart hata formatimiz donsun diye -
  # bu ikisi birlikte olmazsa Spring'in kendi varsayilan hata sayfasi donuyor.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    # Baska bir servise yapilan cagrilar, kullanicinin giris bilgisini kaybetmeden
    # calissin diye - farkli bir is parcaciginda calistirilmasi engelleniyor.
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  # Hata mesaji metinleri bir alt klasorde tutuluyor; nerede aranacagi burada
  # belirtilmezse hata mesajlari bulunamiyor.
  messages:
    basename: messages/messages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/party_db}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 600000
      leak-detection-threshold: 30000
  kafka:
    consumer:
      group-id: party-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.etiya.crm.shared.events.customer
        spring.json.value.default.type: com.etiya.crm.shared.events.customer.CustomerDeletedEvent
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.etiya.crm.partyservice: INFO

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 4000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Baska servisten gelen "bulunamadi" gibi normal hata cevaplari, o servisin coktugu
        # anlamina gelmez; bu tur hatalar devre kesiciyi tetiklemesin diye sayilmiyor.
        ignoreExceptions:
          - feign.FeignException$FeignClientException
