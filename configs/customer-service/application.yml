# Customer Service - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: customer-service-dev.yml / customer-service-test.yml / customer-service-prod.yml

server:
  port: ${PORT:0}
  # Gateway'in ekledigi X-Forwarded-* header'larina guven: springdoc bu sayede
  # OpenAPI servers[] alanini gateway'in disaridan gorunen adresiyle (localhost:8080)
  # uretir, kendi ham host:port'unu (rastgele PORT) degil - Swagger UI "Try it out"
  # aksi halde tarayicidan erisilemeyen bir adrese gitmeye calisir.
  forward-headers-strategy: framework

spring:
  # B-15: NoHandlerFoundException varsayilan olarak firlatilmaz, DispatcherServlet tamamen
  # eslesmeyen path'lerde exception resolver'lara (dolayisiyla GlobalExceptionHandler'a) hic
  # ugramadan dogrudan response.sendError(404) cagirir - bu da bizim ErrorResponse kontratimiz
  # yerine Spring Boot'un varsayilan /error govdesini dondurur. add-mappings:false olmadan bu
  # ayar hicbir etki etmez (static resource handler her seyi "eslesmedi" yerine kendi 404'une
  # yonlendirebiliyor) - ikisi birlikte gerekiyor.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    # Spring Cloud OpenFeign'in circuit breaker entegrasyonu varsayilan olarak her cagriyi
    # ayri bir ExecutorService thread'inde calistirir (TimeLimiter). JwtTokenPropagationInterceptor
    # ise kullanicinin JWT'sini SecurityContextHolder (thread-local) uzerinden okuyor - farkli
    # thread'de bu context bos gelir ve interceptor sessizce gercek kullanici yerine M2M
    # service-account token'ini gonderir. disable-time-limiter=true cagriyi cagiran thread'de
    # senkron calistirir; timeout zaten asagidaki feign.client.config ile saglaniyor.
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  messages:
    basename: messages/messages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: customer-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.etiya.crm.shared.events
        spring.json.value.default.type: com.etiya.crm.shared.events.party.PartyEvent
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

# party-service/contact-info-service/lookup-service'e yapilan Feign cagrilarinin hicbir
# timeout/circuit-breaker koruma olmadan cagrilan servis tikanirsa (deadlock, cok yavas DB,
# vs.) library default'u (connect 10s / read 60s) kadar askida kalmasini onlemek icin.
feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 4000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 404/409/400 gibi normal is kurali cevaplari (musteri bulunamadi, dogrulama hatasi vb.)
        # downstream'in cokmesi degildir - bunlari "hata" sayarsak testte/normal kullanimda ust
        # uste birkac 404 alinmasi bile circuit'i acip herkese 503 dondurebilir. FeignClientException
        # butun 4xx alt tiplerini kapsar (NotFound/Conflict/BadRequest/...); 5xx ve baglanti
        # hatalari (FeignServerException, RetryableException) yine hata olarak sayilmaya devam eder.
        ignoreExceptions:
          - feign.FeignException$FeignClientException
