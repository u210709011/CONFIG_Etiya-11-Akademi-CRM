# Customer Service - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: customer-service-dev.yml / customer-service-test.yml / customer-service-prod.yml

server:
  port: ${PORT:0}
  # Gateway arkasinda calisiyoruz; disaridan gorunen gercek adresi gateway'in ekledigi
  # header'lardan okur, kendi rastgele portunu degil.
  forward-headers-strategy: framework

spring:
  # Olmayan bir adrese istek gelince (404) kendi standart hata formatimiz donsun diye -
  # bu ikisi birlikte olmazsa Spring'in kendi varsayilan hata sayfasi donuyor.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    # Baska bir servise yapilan cagrilar, kullanicinin giris bilgisini kaybetmeden
    # calissin diye - farkli bir is parcaciginda calistirilmasi engelleniyor.
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  # Hata mesaji metinleri bir alt klasorde tutuluyor; nerede aranacagi burada
  # belirtilmezse hata mesajlari bulunamiyor.
  messages:
    basename: messages/messages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: customer-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.etiya.crm.shared.events
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

# Feign cagrilari - korumasiz birakilirsa cagrilan servis tikandiginda library default'u
# (connect 10s / read 60s) kadar askida kalir.
feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 4000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Baska servisten gelen "bulunamadi" gibi normal hata cevaplari, o servisin coktugu
        # anlamina gelmez; bu tur hatalar devre kesiciyi tetiklemesin diye sayilmiyor.
        ignoreExceptions:
          - feign.FeignException$FeignClientException
