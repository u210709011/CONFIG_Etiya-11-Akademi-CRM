# Customer Service - dev ortami: tum altyapi lokalde (podman compose) calisir.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/customer_db
    username: crm
    password: crm
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
      # Redis yavas cevap verirse istek uzun sure beklemesin diye kisa bir sure sinirlandi.
      connect-timeout: 2000ms
      timeout: 2000ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/crm

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Kafka mesajlari bir kullanicinin istegiyle degil arka planda tetiklendigi icin, buradaki
# giris bilgisi normal kullanici girisi degil - sadece bu servise ait otomatik bir hesap.
keycloak:
  client-id: customer-service-m2m
  client-secret: customer-service-m2m-secret

logging:
  level:
    com.etiya.crm.customerservice: DEBUG
