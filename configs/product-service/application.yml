# Product Service - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: application-dev.yml / application-test.yml / application-prod.yml

server:
  port: ${PORT:0}
  shutdown: graceful

spring:
  # Olmayan bir adrese istek gelince (404) kendi standart hata formatimiz donsun diye -
  # bu ikisi birlikte olmazsa Spring'in kendi varsayilan hata sayfasi donuyor.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 600000
      leak-detection-threshold: 30000
  messages:
    basename: messages/messages

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.etiya.crm.productservice: INFO
