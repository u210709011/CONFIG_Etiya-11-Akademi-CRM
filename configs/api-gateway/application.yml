# API Gateway - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: api-gateway-dev.yml / api-gateway-test.yml / api-gateway-prod.yml

server:
  port: ${PORT:8080}
  shutdown: graceful

eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Hata mesaji metinleri bir alt klasorde tutuluyor; nerede aranacagi burada
  # belirtilmezse hata mesajlari bulunamiyor.
  messages:
    basename: messages/messages
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Route'lar asagida elle tanimli; otomatik /{service-id}/** kapali - acik kalirsa
              # internal servis adlari dis API'ye sizar, ayni kaynak iki path'ten erisilebilir olur.
              enabled: false
              lower-case-service-id: true
          # Tum route'lara uygulanan varsayilan filtre - client basina rate limit.
          # RateLimiterConfig#ipKeyResolver bean'ini SpEL ile referans alir.
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
          routes:
            - id: party-service
              uri: lb://party-service
              predicates:
                - Path=/api/v1/parties/**,/api/v1/individuals/**

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**

            - id: contact-info-service
              uri: lb://contact-info-service
              predicates:
                - Path=/api/v1/addresses/**,/api/v1/contact-mediums/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/product-specs/**,/api/v1/product-catalogs/**,/api/v1/products/**,/api/v1/product-catalog-offerings/**,/api/v1/product-offerings/**,/api/v1/product-offering-relations/**,/api/v1/product-relations/**,/api/v1/product-characteristic-values/**,/api/v1/product-spec-resource-specs/**,/api/v1/product-spec-service-specs/**,/api/v1/product-campaigns/**,/api/v1/campaign-offerings/**,/api/v1/product-offering-char-uses/**

            - id: lookup-service
              uri: lb://lookup-service
              predicates:
                - Path=/api/v1/general-types/**,/api/v1/general-statuses/**,/api/v1/characteristic-values/**,/api/v1/characteristics/**,/api/v1/resource-specs/**,/api/v1/service-specs/**,/api/v1/type-values/**

            # Servis kayit panosuna (Eureka) gateway uzerinden de erisim saglar; adres ortama gore degisir.
            - id: discovery-server-ui
              uri: ${discovery.dashboard-url:http://localhost:8761}
              predicates:
                - Path=/eureka/web
              filters:
                - SetPath=/

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.issuer-uri}

# Tum servislerin API dokumanlari tek bir sayfada (http://localhost:8080/swagger-ui.html)
# toplanir; ust-sagdaki listeden hangi servisin dokumani gorulecegi secilir.
springdoc:
  swagger-ui:
    urls:
      - name: API Gateway (Auth)
        url: /v3/api-docs
      - name: Customer Service
        url: /v3/api-docs/customer-service
      - name: Contact Info Service
        url: /v3/api-docs/contact-info-service
      - name: Lookup Service
        url: /v3/api-docs/lookup-service
      - name: Order Service
        url: /v3/api-docs/order-service

