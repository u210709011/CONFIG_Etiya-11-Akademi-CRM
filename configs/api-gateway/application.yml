# API Gateway - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: api-gateway-dev.yml / api-gateway-test.yml / api-gateway-prod.yml

server:
  port: ${PORT:8080}

eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

spring:
  # messages/messages.properties alt klasorde oldugu icin varsayilan basename ("messages",
  # root'u arar) bunu bulamiyordu - her resolve() cagrisi NoSuchMessageException firlatiyor,
  # yani AuthExceptionHandler'daki her custom exception (AccountLockedException vb.) dogru
  # 401/423 yerine 500'e siziyordu (bkz. customer-service/contact-info-service/party-service
  # application.yml'deki ayni fix).
  messages:
    basename: messages/messages
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Route'lar artik asagida elle tanimli. Otomatik /{service-id}/**
              # yonlendirmesi kapali; acik kalirsa internal servis adlari
              # (customer-service, party-service...) dis API yuzeyine sizar ve
              # ayni kaynaga iki farkli path'ten erisilebilir hale gelir.
              enabled: false
              lower-case-service-id: true
          routes:
            - id: party-service
              uri: lb://party-service
              predicates:
                - Path=/api/v1/parties/**,/api/v1/individuals/**

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**

            - id: contact-info-service
              uri: lb://contact-info-service
              predicates:
                - Path=/api/v1/addresses/**,/api/v1/contact-mediums/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/product-specs/**,/api/v1/product-catalogs/**,/api/v1/products/**,/api/v1/product-catalog-offerings/**,
                /api/v1/product-offerings/**,/api/v1/product-offering-relations/**,/api/v1/product-relations/**,/api/v1/product-characteristic-values/**,
                /api/v1/product-spec-resource-specs/**,/api/v1/product-spec-service-specs/**,/api/v1/product-campaigns/**,/api/v1/campaign-offerings/**

            - id: lookup-service
              uri: lb://lookup-service
              predicates:
                - Path=/api/v1/general-types/**,/api/v1/general-statuses/**,/api/v1/characteristic-values/**,/api/v1/characteristics/**,/api/v1/resource-specs/**,/api/v1/service-specs/**,/api/v1/type-values/**

            # Eureka paneline gateway uzerinden erisim kolayligi. Ortama gore
            # dashboard adresi degisir (bkz. eureka.client.service-url).
            - id: discovery-server-ui
              uri: ${discovery.dashboard-url:http://localhost:8761}
              predicates:
                - Path=/eureka/web
              filters:
                - SetPath=/

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.issuer-uri}

# Tek bir Swagger UI'da (http://localhost:8080/swagger-ui.html) tum servisler:
# gateway'in kendi /v3/api-docs'u + SwaggerAggregatorConfig'in ayni-origin'e
# tasidigi diger servislerin dokumanlari, ust-sagdaki dropdown'dan secilir.
springdoc:
  swagger-ui:
    urls:
      - name: API Gateway (Auth)
        url: /v3/api-docs
      - name: Customer Service
        url: /v3/api-docs/customer-service
      - name: Contact Info Service
        url: /v3/api-docs/contact-info-service
      - name: Lookup Service
        url: /v3/api-docs/lookup-service
      - name: Order Service
        url: /v3/api-docs/order-service

