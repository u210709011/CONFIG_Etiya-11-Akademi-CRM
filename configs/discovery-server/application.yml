# Discovery Server (Eureka) - tum ortamlar icin gecerli ortak konfigurasyon.
# Ortama ozel degerler: discovery-server-dev.yml / discovery-server-test.yml / discovery-server-prod.yml

server:
  port: 8761
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

eureka:
  client:
    # Eureka Server kendisini bir client olarak kaydetmez
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
